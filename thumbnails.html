<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thumbnails — Tanvir H.</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="cursor-glow"></div>
  <header class="nav">
    <a class="brand" href="index.html">Tanvir H.</a>
    <nav><a href="index.html#work">Work</a><a href="index.html#about">About</a><a href="index.html#contact">Contact</a></nav>
  </header>
  <main>
    <section class="gallery-hero">
      <a class="back" href="index.html#work">← Back to Work</a>
      <p class="section-kicker">Portfolio Category</p>
      <h1>Thumbnails</h1>
      <p class="hero-text">Upload your images inside <b>assets/projects/thumbnails/</b> and name them 01.jpg, 02.jpg, 03.jpg...</p>
    </section>
    <section class="gallery-grid">
    <div class="gallery-item"><img src="assets/projects/thumbnails/01.jpg" alt="Thumbnails 1"></div>
    <div class="gallery-item"><img src="assets/projects/thumbnails/02.jpg" alt="Thumbnails 2"></div>
    <div class="gallery-item"><img src="assets/projects/thumbnails/03.jpg" alt="Thumbnails 3"></div>
    <div class="gallery-item"><img src="assets/projects/thumbnails/04.jpg" alt="Thumbnails 4"></div>
    <div class="gallery-item"><img src="assets/projects/thumbnails/05.jpg" alt="Thumbnails 5"></div>
    <div class="gallery-item"><img src="assets/projects/thumbnails/06.jpg" alt="Thumbnails 6"></div>
    </section>
  </main>
  <div class="lightbox"><button>Close</button><img src="" alt="Preview"></div>
  <script src="script.js"></script>
</body>
</html>
